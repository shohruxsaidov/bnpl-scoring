# Admin portal — served under /admin base path (matches vite base: '/admin').

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    resolver 127.0.0.11 valid=30s;

    # Forward API traffic to the backend.
    location /api/ {
        set $api_upstream http://api:4000;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Long-cache hashed Vite build assets.
    location /admin/assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA history-mode fallback under /admin.
    location /admin {
        try_files $uri $uri/ /admin/index.html;
    }

    # Redirect bare root to /admin.
    location = / {
        return 301 /admin;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;
    gzip_min_length 1024;
}
