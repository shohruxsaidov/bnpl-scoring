<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Database Relations</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0f1117; color: #e2e8f0; font-family: 'SF Mono', 'Fira Code', monospace; overflow: hidden; }

  #canvas { width: 100vw; height: 100vh; }

  /* nodes */
  .node rect {
    rx: 6; ry: 6;
    stroke-width: 1.5;
    cursor: grab;
  }
  .node rect:active { cursor: grabbing; }
  .node text.label {
    font-size: 11px;
    font-weight: 600;
    fill: #fff;
    pointer-events: none;
    dominant-baseline: middle;
    text-anchor: middle;
  }
  .node text.rows {
    font-size: 9px;
    fill: rgba(255,255,255,0.55);
    pointer-events: none;
    dominant-baseline: middle;
    text-anchor: middle;
  }

  /* links */
  .link {
    fill: none;
    stroke-width: 1.5;
    opacity: 0.55;
  }
  .link.highlighted { opacity: 1; stroke-width: 2.5; }

  /* arrow markers */
  marker path { }

  /* tooltip */
  #tooltip {
    position: fixed;
    background: #1e2535;
    border: 1px solid #334155;
    border-radius: 8px;
    padding: 12px 14px;
    font-size: 11px;
    line-height: 1.7;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.15s;
    max-width: 280px;
    z-index: 100;
  }
  #tooltip .tt-name { font-size: 13px; font-weight: 700; color: #7dd3fc; margin-bottom: 6px; }
  #tooltip .tt-rows { color: #94a3b8; margin-bottom: 8px; font-size: 10px; }
  #tooltip .tt-col { color: #cbd5e1; }
  #tooltip .tt-col span { color: #86efac; }

  /* legend */
  #legend {
    position: fixed;
    bottom: 20px;
    left: 20px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    background: rgba(15,17,23,0.85);
    border: 1px solid #1e293b;
    border-radius: 8px;
    padding: 12px 14px;
    font-size: 10px;
  }
  #legend .leg-item { display: flex; align-items: center; gap: 8px; }
  #legend .leg-dot { width: 12px; height: 12px; border-radius: 3px; flex-shrink: 0; }

  /* controls */
  #controls {
    position: fixed;
    top: 16px;
    right: 16px;
    display: flex;
    gap: 8px;
  }
  #controls button {
    background: #1e293b;
    border: 1px solid #334155;
    color: #94a3b8;
    border-radius: 6px;
    padding: 6px 12px;
    font-size: 11px;
    cursor: pointer;
    font-family: inherit;
  }
  #controls button:hover { background: #2d3f55; color: #e2e8f0; }

  #title {
    position: fixed;
    top: 16px;
    left: 20px;
    font-size: 13px;
    color: #475569;
    letter-spacing: 0.05em;
  }
  #title span { color: #7dd3fc; font-weight: 600; }

  /* ---- dialog ---- */
  #dialog-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.55);
    backdrop-filter: blur(3px);
    z-index: 200;
    display: flex; align-items: center; justify-content: center;
    opacity: 0; pointer-events: none;
    transition: opacity 0.2s;
  }
  #dialog-overlay.open { opacity: 1; pointer-events: all; }

  #dialog {
    background: #111827;
    border: 1px solid #1e293b;
    border-radius: 12px;
    width: min(640px, 92vw);
    max-height: 82vh;
    display: flex; flex-direction: column;
    transform: translateY(10px) scale(0.98);
    transition: transform 0.2s;
    overflow: hidden;
  }
  #dialog-overlay.open #dialog { transform: translateY(0) scale(1); }

  #dialog-header {
    padding: 18px 20px 14px;
    border-bottom: 1px solid #1e293b;
    display: flex; align-items: flex-start; justify-content: space-between; gap: 12px;
    flex-shrink: 0;
  }
  #dialog-header .dh-left { display: flex; flex-direction: column; gap: 4px; }
  #dialog-title {
    font-size: 16px; font-weight: 700; letter-spacing: 0.02em;
  }
  #dialog-badge {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 10px; color: #94a3b8;
  }
  #dialog-badge .badge-dot { width: 8px; height: 8px; border-radius: 2px; }
  #dialog-close {
    background: none; border: none; color: #475569;
    font-size: 20px; cursor: pointer; line-height: 1; padding: 2px 6px; border-radius: 4px;
    flex-shrink: 0;
  }
  #dialog-close:hover { background: #1e293b; color: #e2e8f0; }

  #dialog-body {
    overflow-y: auto; padding: 16px 20px 20px;
    display: flex; flex-direction: column; gap: 18px;
  }
  #dialog-body::-webkit-scrollbar { width: 4px; }
  #dialog-body::-webkit-scrollbar-track { background: transparent; }
  #dialog-body::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 4px; }

  .db-section-title {
    font-size: 9px; font-weight: 700; letter-spacing: 0.12em;
    text-transform: uppercase; color: #475569; margin-bottom: 8px;
  }

  /* stats row */
  .db-stats { display: flex; gap: 10px; flex-wrap: wrap; }
  .db-stat {
    background: #0f1623; border: 1px solid #1e293b; border-radius: 8px;
    padding: 8px 14px; display: flex; flex-direction: column; gap: 2px;
  }
  .db-stat .st-val { font-size: 18px; font-weight: 700; color: #e2e8f0; }
  .db-stat .st-lbl { font-size: 9px; color: #475569; letter-spacing: 0.08em; text-transform: uppercase; }

  /* description */
  #dialog-desc { font-size: 12px; color: #94a3b8; line-height: 1.7; }

  /* columns table */
  .col-table { width: 100%; border-collapse: collapse; font-size: 11px; }
  .col-table thead th {
    text-align: left; padding: 5px 8px;
    font-size: 9px; letter-spacing: 0.1em; text-transform: uppercase;
    color: #475569; border-bottom: 1px solid #1e293b;
  }
  .col-table tbody tr { border-bottom: 1px solid #0f1623; }
  .col-table tbody tr:hover { background: #0f1623; }
  .col-table td { padding: 6px 8px; }
  .col-table td.col-name { color: #86efac; font-weight: 600; }
  .col-table td.col-type { color: #7dd3fc; }
  .col-table td.col-note { color: #64748b; font-size: 10px; }
  .col-pk  { background: #fbbf24; color: #000; font-size: 8px; font-weight: 700;
             border-radius: 3px; padding: 1px 4px; margin-right: 4px; }
  .col-fk  { background: #6366f1; color: #fff; font-size: 8px; font-weight: 700;
             border-radius: 3px; padding: 1px 4px; margin-right: 4px; }

  /* relations */
  .rel-list { display: flex; flex-direction: column; gap: 5px; }
  .rel-item {
    display: flex; align-items: center; gap: 8px;
    background: #0f1623; border: 1px solid #1e293b; border-radius: 6px;
    padding: 7px 10px; font-size: 11px; cursor: pointer;
  }
  .rel-item:hover { border-color: #334155; background: #141e2e; }
  .rel-item .rel-arrow { color: #475569; font-size: 13px; flex-shrink: 0; }
  .rel-item .rel-table { font-weight: 600; }
  .rel-item .rel-key { color: #64748b; font-size: 10px; margin-left: auto; }
  .rel-empty { font-size: 11px; color: #334155; }
</style>
</head>
<body>
<svg id="canvas"></svg>

<div id="tooltip"></div>

<!-- dialog -->
<div id="dialog-overlay">
  <div id="dialog">
    <div id="dialog-header">
      <div class="dh-left">
        <div id="dialog-title"></div>
        <div id="dialog-badge"><div class="badge-dot"></div><span id="dialog-group"></span></div>
      </div>
      <button id="dialog-close">✕</button>
    </div>
    <div id="dialog-body"></div>
  </div>
</div>

<div id="title">all.sql — <span>table relationships</span></div>

<div id="controls">
  <button id="btn-reset">Reset View</button>
  <button id="btn-freeze">Freeze</button>
</div>

<div id="legend"></div>

<script>
const GROUPS = {
  scoring:    { label: "Scoring",      color: "#6366f1" },
  autopay:    { label: "Autopayments", color: "#ec4899" },
  deals:      { label: "Deals",        color: "#f59e0b" },
  users:      { label: "Users/Ident",  color: "#10b981" },
  payments:   { label: "Payments",     color: "#06b6d4" },
  accounts:   { label: "Accounting",   color: "#8b5cf6" },
  schedule:   { label: "Schedules",    color: "#f97316" },
  catalog:    { label: "Catalog",      color: "#84cc16" },
  platform:   { label: "Platform",     color: "#64748b" },
};

// schema: [ [name, type, flags, note] ]  flags: pk / fk / ts / arr / json
const nodes = [
  // --- SCORING ---
  { id: "scoring_sessions", group: "scoring", rows: "16 357",
    desc: "One session per scoring request. Snapshot of client passport data stored in data(jsonb). Range: 2024-02-21 → 2026-05-16.",
    cols: ["id","identificator_id","provider_id","type","data(jsonb)","created_at","initiator"],
    schema: [
      ["id","uuid","pk",""],
      ["identificator_id","uuid","fk","→ identificators"],
      ["provider_id","uuid","fk","→ providers"],
      ["type","integer","","0 = standard"],
      ["data","jsonb","json","Age, Sex, Phone, Pinfl, Address, ClaimId, ClientId, LastName, FirstName, DateBirth, DocNumber, RegionId, ConfirmationId"],
      ["created_at","timestamp","ts",""],
      ["card_identificator_id","uuid","","nullable"],
      ["initiator","integer","","0=agent, 1=other"],
      ["is_deleted","boolean","","soft delete"],
    ]},
  { id: "scores", group: "scoring", rows: "2 996",
    desc: "Final scoring result per session: total points and approved credit sum.",
    cols: ["id","score_session_id","points","enable_sum","created_at","expires_date","scoring_model(jsonb)"],
    schema: [
      ["id","uuid","pk",""],
      ["score_session_id","uuid","fk","→ scoring_sessions"],
      ["provider_id","uuid","fk","→ providers"],
      ["identifier","text","","PINFL, nullable"],
      ["points","numeric","","total score"],
      ["enable_sum","numeric","","approved credit amount"],
      ["created_at","timestamp","ts",""],
      ["expires_date","timestamp","ts","score validity deadline"],
      ["scoring_model","jsonb","json","model parameters"],
      ["is_deleted","boolean","",""],
    ]},
  { id: "info", group: "scoring", rows: "219 412",
    desc: "Raw data blobs fetched from external providers per session. Each row is one data type (e.g. IncomeLevelInfo, PassportInfo, DebtSumInfo).",
    cols: ["id","score_session_id","type_key","data(jsonb)","created_at","source"],
    schema: [
      ["id","uuid","pk",""],
      ["score_session_id","uuid","fk","→ scoring_sessions"],
      ["type_key","text","","IncomeLevelInfo | PassportInfo | PeriodInfo | DebtSumInfo | InfoScoreContractInfo | PledgerLiabilityInfo | GuarantorLiabilityInfo | MortgageInfo | JuridicalInfo | DecommissionInfo | LoanApplicationInfo | MonthlyAveragePaymentInfo | ..."],
      ["data","jsonb","json","payload varies by type_key"],
      ["created_at","timestamp","ts",""],
      ["source","text","","source service name"],
      ["is_deleted","boolean","",""],
    ]},
  { id: "info_scores", group: "scoring", rows: "230 256",
    desc: "Scored sub-indicators derived from each info row. One info row produces multiple scored categories.",
    cols: ["id","info_id","score","category","value","source","created_at"],
    schema: [
      ["id","uuid","pk",""],
      ["info_id","uuid","fk","→ info"],
      ["score","numeric","","points for this indicator"],
      ["category","text","","indicator category"],
      ["value","text","","raw value"],
      ["source","text","",""],
      ["description","text","","nullable"],
      ["created_at","timestamp","ts",""],
      ["is_deleted","boolean","",""],
    ]},
  { id: "score_states", group: "scoring", rows: "62 186",
    desc: "Status history of scoring sessions (e.g. pending, approved, rejected). Multiple states per session.",
    cols: ["id","score_session_id","status","contract_ids[]","created_at","provider_id"],
    schema: [
      ["id","uuid","pk",""],
      ["score_session_id","uuid","fk","→ scoring_sessions"],
      ["contract_ids","text[]","arr","associated contract IDs"],
      ["code","text","","status code, nullable"],
      ["status","integer","","current status"],
      ["created_at","timestamp","ts",""],
      ["provider_id","uuid","fk","→ providers"],
      ["is_deleted","boolean","",""],
    ]},
  { id: "identificators", group: "scoring", rows: "48 424",
    desc: "Lightweight PINFL registry used by the scoring service to reference clients.",
    cols: ["id","identifier(PINFL)","type","is_deleted"],
    schema: [
      ["id","uuid","pk",""],
      ["identifier","text","","PINFL (14-digit national ID)"],
      ["type","integer","","0 = PINFL"],
      ["is_deleted","boolean","",""],
    ]},
  { id: "providers", group: "scoring", rows: "~10",
    desc: "External data providers used for fetching scoring info (credit bureaus, state registries, etc.).",
    cols: ["id","name","method","credentials(jsonb)","stop_factors[]","type"],
    schema: [
      ["id","uuid","pk",""],
      ["name","text","","provider name"],
      ["method","text","","integration method"],
      ["credentials","jsonb","json","auth secrets, nullable"],
      ["stop_factors","integer[]","arr","factor codes that block scoring"],
      ["type","text","","provider category"],
      ["visibility","smallint","","0=hidden"],
      ["is_deleted","boolean","",""],
    ]},

  // --- AUTOPAY ---
  { id: "auto_payments", group: "autopay", rows: "1 500 445",
    desc: "Scheduled automatic payment jobs linked to a contract. Heaviest table after auto_payment_states.",
    cols: ["id","contract_id","amount","date","schedule_date","type"],
    schema: [
      ["id","uuid","pk",""],
      ["contract_id","uuid","","→ contracts"],
      ["amount","numeric","","payment amount"],
      ["date","timestamp","ts","actual execution time"],
      ["schedule_date","date","","planned date"],
      ["type","integer","","payment type"],
      ["is_deleted","boolean","",""],
    ]},
  { id: "auto_payment_states", group: "autopay", rows: "4 500 825",
    desc: "Status log for each autopayment attempt. The single largest table (~4.5 M rows).",
    cols: ["id","auto_payment_id","payed_amount","balance_amount","status","date"],
    schema: [
      ["id","uuid","pk",""],
      ["auto_payment_id","uuid","fk","→ auto_payments"],
      ["payed_amount","numeric","","amount actually charged"],
      ["balance_amount","numeric","","remaining balance"],
      ["status","integer","","payment result code"],
      ["date","timestamp","ts",""],
      ["is_deleted","boolean","",""],
    ]},
  { id: "request_histories", group: "autopay", rows: "1 524 788",
    desc: "Full HTTP request/response log between autopayment service and external endpoints.",
    cols: ["id","created_date","user_id","url","is_success","request","response"],
    schema: [
      ["id","bigint","pk","identity sequence"],
      ["created_date","timestamp","ts",""],
      ["user_id","bigint","","initiating user"],
      ["request","text","","full request body"],
      ["response","text","","full response body"],
      ["url","text","","endpoint URL"],
      ["is_success","boolean","",""],
    ]},

  // --- DEALS ---
  { id: "deals", group: "deals", rows: "3 609",
    desc: "Root entity for a purchase deal. Almost no fields — all meaningful state lives in deal_states, deal_fin_states, deal_items etc.",
    cols: ["id","agent_id","is_deleted"],
    schema: [
      ["id","bigint","pk","identity sequence"],
      ["agent_id","uuid","","owning agent"],
      ["is_deleted","boolean","",""],
    ]},
  { id: "deal_states", group: "deals", rows: "16 664",
    desc: "Status history of deals (draft → processing → active → closed). Multiple rows per deal.",
    cols: ["id","deal_id","deal_status","created_at","pay_day","pay_start_date","reason"],
    schema: [
      ["id","uuid","pk",""],
      ["deal_id","bigint","fk","→ deals"],
      ["deal_status","enum","","deal_status enum"],
      ["created_at","timestamptz","ts","DEFAULT now()"],
      ["pay_day","smallint","","day of month for payment"],
      ["pay_start_date","date","","first payment date, nullable"],
      ["note","text","","comment, nullable"],
      ["reason","integer","","reason code for status change"],
      ["processing_valid_until","timestamptz","ts","nullable"],
      ["is_deleted","boolean","",""],
    ]},
  { id: "deal_agents", group: "deals", rows: "3 428",
    desc: "Agent assignments per deal. Data starts 2024-08-21.",
    cols: ["id","deal_id","agent_id","managed_agent_id","created_at"],
    schema: [
      ["id","uuid","pk",""],
      ["deal_id","bigint","fk","→ deals"],
      ["agent_id","uuid","","assigned agent"],
      ["managed_agent_id","uuid","","manager agent"],
      ["created_at","timestamptz","ts",""],
      ["is_deleted","boolean","",""],
    ]},
  { id: "deal_clients", group: "deals", rows: "1 014",
    desc: "Client participants in a deal, including their scoring result at the time of the deal.",
    cols: ["id","deal_id","identifier(PINFL)","scoring_id","score","enable_sum"],
    schema: [
      ["id","uuid","pk",""],
      ["deal_id","bigint","fk","→ deals"],
      ["client_id","text","","external client ID"],
      ["type","integer","","client role in deal"],
      ["identificator_id","uuid","",""],
      ["identifier","text","","PINFL"],
      ["scoring_id","uuid","fk","→ scoring_sessions"],
      ["score","numeric","","score at deal time"],
      ["enable_sum","numeric","","approved sum at deal time"],
      ["data","jsonb","json","nullable"],
      ["is_deleted","boolean","",""],
    ]},
  { id: "deal_items", group: "deals", rows: "3 903",
    desc: "Products/goods included in the deal. name is multilingual JSON.",
    cols: ["id","deal_id","merchant_id","category_id","name(jsonb)","sku"],
    schema: [
      ["id","uuid","pk",""],
      ["deal_id","bigint","fk","→ deals"],
      ["merchant_id","uuid","",""],
      ["category_id","bigint","fk","→ categories"],
      ["name","jsonb","json","multilingual title"],
      ["sku","text","",""],
      ["product_code","text","",""],
      ["unit_code","text","","unit of measure code"],
      ["unit","text","","unit label"],
      ["buy_identifier","text","","buyout reference, nullable"],
      ["data","jsonb","json","nullable"],
      ["is_deleted","boolean","",""],
    ]},
  { id: "deal_item_states", group: "deals", rows: "5 474",
    desc: "Price/status snapshots per deal item line. Tracks price changes over the deal lifecycle.",
    cols: ["id","deal_item_id","price","vat","count","status","created_at"],
    schema: [
      ["id","uuid","pk",""],
      ["deal_item_id","uuid","fk","→ deal_items"],
      ["serials","text[]","arr","serial numbers"],
      ["count","integer","","quantity"],
      ["price","numeric","","sale price"],
      ["vat","numeric","","VAT amount"],
      ["m_price","numeric","","merchant currency price"],
      ["m_currency","integer","","merchant currency code"],
      ["status","enum","","deal_item_status"],
      ["created_at","timestamptz","ts","DEFAULT now()"],
      ["is_deleted","boolean","",""],
    ]},
  { id: "deal_fin_states", group: "deals", rows: "8 625",
    desc: "Financial terms snapshot per deal (loan sum, prepay, term duration, deal type).",
    cols: ["id","deal_id","status","sum","prepay","term_duration","deal_type"],
    schema: [
      ["id","uuid","pk",""],
      ["deal_id","bigint","fk","→ deals"],
      ["deal_item_id","uuid","fk","→ deal_items, nullable"],
      ["created_at","timestamptz","ts","DEFAULT now()"],
      ["status","enum","","deal_fin_status"],
      ["fin_product_id","uuid","","financial product"],
      ["fin_term_id","bigint","","term config ID"],
      ["term_duration","integer","","e.g. 12 months"],
      ["term_type","enum","","term_type (months/days)"],
      ["deal_type","enum","","deal_type"],
      ["product_source","enum","","product_source"],
      ["prepay","numeric","","down payment"],
      ["sum","numeric","","financed amount"],
      ["vat","numeric","",""],
      ["currency","integer","","currency code"],
      ["is_deleted","boolean","",""],
    ]},
  { id: "deal_refs", group: "deals", rows: "1 161",
    desc: "External references linked to a deal (documents, vouchers, etc.) typed by deal_ref_type enum.",
    cols: ["id","deal_id","ref_id","type","ref_type"],
    schema: [
      ["id","uuid","pk",""],
      ["deal_id","bigint","fk","→ deals"],
      ["deal_client_id","uuid","","nullable"],
      ["ref_id","uuid","","referenced object ID"],
      ["type","enum","","deal_ref_type"],
      ["ref_type","text","","string label, nullable"],
      ["data","jsonb","json","nullable"],
      ["is_deleted","boolean","",""],
    ]},
  { id: "contracts", group: "deals", rows: "851",
    desc: "Legal contracts issued for deals.",
    cols: ["id","amount","identifier","expire_date","date","client_id"],
    schema: [
      ["id","uuid","pk",""],
      ["amount","numeric","","contract amount"],
      ["identifier","text","","contract number"],
      ["expire_date","timestamp","ts","expiry"],
      ["date","timestamp","ts","issue date"],
      ["client_id","uuid","",""],
      ["client_type","integer","",""],
      ["description","text","",""],
      ["is_deleted","boolean","",""],
    ]},
  { id: "contract_states", group: "deals", rows: "771",
    desc: "Status history for contracts.",
    cols: ["id","contract_id","status","date"],
    schema: [
      ["id","uuid","pk",""],
      ["contract_id","uuid","fk","→ contracts"],
      ["status","integer","",""],
      ["date","timestamp","ts",""],
      ["is_deleted","boolean","",""],
    ]},
  { id: "confirmations", group: "deals", rows: "65 523",
    desc: "OTP / signature confirmations collected during the contract signing flow.",
    cols: ["id","contract_id","service_identifier"],
    schema: [
      ["id","uuid","pk",""],
      ["contract_id","uuid","fk","→ contracts"],
      ["service_identifier","text","","external service token"],
      ["is_deleted","boolean","",""],
    ]},

  // --- USERS / IDENT ---
  { id: "users", group: "users", rows: "21 829",
    desc: "ASP.NET Identity user table. Covers agents, admins and client-facing accounts.",
    cols: ["id","first_name","last_name","email","phone_number","lockout_end","access_failed_count"],
    schema: [
      ["id","bigint","pk","identity"],
      ["first_name","text","","nullable"],
      ["last_name","text","","nullable"],
      ["user_name","varchar(256)","","login"],
      ["email","varchar(256)","",""],
      ["phone_number","text","",""],
      ["password_hash","text","","ASP.NET Identity hash"],
      ["lockout_end","timestamptz","ts","nullable"],
      ["lockout_enabled","boolean","",""],
      ["access_failed_count","integer","",""],
      ["two_factor_enabled","boolean","",""],
    ]},
  { id: "user_tokens", group: "users", rows: "18 138",
    desc: "ASP.NET Identity tokens: refresh tokens, 2FA codes, external login tokens.",
    cols: ["user_id","login_provider","name","value"],
    schema: [
      ["user_id","bigint","fk","→ users"],
      ["login_provider","text","","provider name"],
      ["name","text","","token type"],
      ["value","text","","token value"],
    ]},
  { id: "identifications", group: "users", rows: "20 724",
    desc: "Identity verification sessions linking a user to a provider check.",
    cols: ["id","identifier","user_id","provider_id","agent_id","data(jsonb)"],
    schema: [
      ["id","uuid","pk",""],
      ["identifier","text","","PINFL or external ID"],
      ["user_id","bigint","fk","→ users"],

// ---- D3 setup ----
const svg = d3.select("#canvas");
const W = window.innerWidth, H = window.innerHeight;
svg.attr("width", W).attr("height", H);

const g = svg.append("g");

// zoom
const zoom = d3.zoom().scaleExtent([0.08, 3]).on("zoom", e => g.attr("transform", e.transform));
svg.call(zoom);

// initial zoom out
svg.call(zoom.transform, d3.zoomIdentity.translate(W * 0.5, H * 0.5).scale(0.55).translate(-W * 0.5, -H * 0.5));

// arrow markers per group color
const defs = svg.append("defs");
Object.entries(GROUPS).forEach(([key, {color}]) => {
  defs.append("marker")
    .attr("id", `arrow-${key}`)
    .attr("viewBox", "0 -5 10 10")
    .attr("refX", 28)
    .attr("refY", 0)
    .attr("markerWidth", 6)
    .attr("markerHeight", 6)
    .attr("orient", "auto")
    .append("path")
    .attr("d", "M0,-5L10,0L0,5")
    .attr("fill", color);
});

// node dims
const NW = 140, NH = 44;

// simulation
const sim = d3.forceSimulation(nodes)
  .force("link", d3.forceLink(links).id(d => d.id).distance(220).strength(0.4))
  .force("charge", d3.forceManyBody().strength(-600))
  .force("center", d3.forceCenter(W / 2, H / 2))
  .force("collide", d3.forceCollide(90))
  .force("x", d3.forceX(W / 2).strength(0.04))
  .force("y", d3.forceY(H / 2).strength(0.04));

// links
const linkSel = g.append("g").selectAll("path")
  .data(links).enter().append("path")
  .attr("class", "link")
  .attr("stroke", d => {
    const tgt = nodes.find(n => n.id === (d.target.id || d.target));
    return GROUPS[tgt?.group]?.color || "#64748b";
  })
  .attr("marker-end", d => {
    const tgt = nodes.find(n => n.id === (d.target.id || d.target));
    return `url(#arrow-${tgt?.group || "platform"})`;
  });

// nodes
let dragMoved = false;
const nodeSel = g.append("g").selectAll("g")
  .data(nodes).enter().append("g")
  .attr("class", "node")
  .call(d3.drag()
    .on("start", (e, d) => { dragMoved = false; if (!e.active) sim.alphaTarget(0.3).restart(); d.fx = d.x; d.fy = d.y; })
    .on("drag",  (e, d) => { dragMoved = true; d.fx = e.x; d.fy = e.y; })
    .on("end",   (e, d) => { if (!e.active) sim.alphaTarget(0); if (!frozen) { d.fx = null; d.fy = null; } })
  )
  .on("mouseover", showTooltip)
  .on("mousemove", moveTooltip)
  .on("mouseout",  hideTooltip)
  .on("click", (e, d) => { if (!dragMoved) { e.stopPropagation(); openDialog(d); } });

nodeSel.append("rect")
  .attr("x", -NW / 2).attr("y", -NH / 2)
  .attr("width", NW).attr("height", NH)
  .attr("fill", d => {
    const c = d3.color(GROUPS[d.group].color);
    c.opacity = 0.18;
    return c + "";
  })
  .attr("stroke", d => GROUPS[d.group].color);

nodeSel.append("text")
  .attr("class", "label")
  .attr("y", -7)
  .text(d => d.id.length > 18 ? d.id.replace(/_/g, "​_") : d.id);

nodeSel.append("text")
  .attr("class", "rows")
  .attr("y", 11)
  .text(d => d.rows + " rows");

sim.on("tick", () => {
  linkSel.attr("d", d => {
    const sx = d.source.x, sy = d.source.y;
    const tx = d.target.x, ty = d.target.y;
    const dx = tx - sx, dy = ty - sy;
    const dr = Math.sqrt(dx*dx + dy*dy) * 1.4;
    return `M${sx},${sy} A${dr},${dr} 0 0,1 ${tx},${ty}`;
  });
  nodeSel.attr("transform", d => `translate(${d.x},${d.y})`);
});

// tooltip
const tooltip = document.getElementById("tooltip");
function showTooltip(e, d) {
  const color = GROUPS[d.group].color;
  tooltip.innerHTML = `
    <div class="tt-name" style="color:${color}">${d.id}</div>
    <div class="tt-rows">${d.rows} rows · ${GROUPS[d.group].label}</div>
    ${d.cols.map(c => `<div class="tt-col">· <span>${c}</span></div>`).join("")}
  `;
  tooltip.style.opacity = "1";

  // highlight connected links
  const connectedIds = new Set([d.id]);
  links.forEach(l => {
    const sid = l.source.id || l.source, tid = l.target.id || l.target;
    if (sid === d.id) connectedIds.add(tid);
    if (tid === d.id) connectedIds.add(sid);
  });
  linkSel.classed("highlighted", l => {
    const sid = l.source.id || l.source, tid = l.target.id || l.target;
    return sid === d.id || tid === d.id;
  });
  nodeSel.select("rect").attr("opacity", n => connectedIds.has(n.id) ? 1 : 0.3);
}
function moveTooltip(e) {
  const x = e.clientX + 16, y = e.clientY + 16;
  tooltip.style.left = Math.min(x, window.innerWidth - 290) + "px";
  tooltip.style.top  = Math.min(y, window.innerHeight - 200) + "px";
}
function hideTooltip() {
  tooltip.style.opacity = "0";
  linkSel.classed("highlighted", false);
  nodeSel.select("rect").attr("opacity", 1);
}

// ---- dialog ----
const overlay  = document.getElementById("dialog-overlay");
const dlgTitle = document.getElementById("dialog-title");
const dlgBadge = document.getElementById("dialog-group");
const dlgBody  = document.getElementById("dialog-body");
const dlgDot   = document.querySelector("#dialog-badge .badge-dot");

function openDialog(d) {
  const grp   = GROUPS[d.group];
  const color = grp.color;

  dlgTitle.textContent = d.id;
  dlgTitle.style.color = color;
  dlgDot.style.background = color;
  dlgBadge.textContent = `${grp.label}  ·  ${d.rows} rows`;

  // build relations
  const outRels = links
    .filter(l => (l.source.id || l.source) === d.id)
    .map(l => ({ dir: "out", table: l.target.id || l.target, key: l.label }));
  const inRels  = links
    .filter(l => (l.target.id || l.target) === d.id)
    .map(l => ({ dir: "in",  table: l.source.id || l.source, key: l.label }));

  const flagBadge = f => {
    if (f === "pk")   return `<span class="col-pk">PK</span>`;
    if (f === "fk")   return `<span class="col-fk">FK</span>`;
    return "";
  };
  const typeColor = t => {
    if (t.includes("timestamp") || t.includes("date")) return "#fbbf24";
    if (t.includes("jsonb") || t === "json")            return "#f97316";
    if (t.includes("[]") || t === "arr")                return "#a78bfa";
    if (t.includes("uuid"))                             return "#7dd3fc";
    if (t.includes("bigint") || t.includes("integer") || t.includes("numeric") || t.includes("smallint") || t.includes("boolean")) return "#86efac";
    return "#94a3b8";
  };

  dlgBody.innerHTML = `
    ${d.desc ? `<div>
      <div class="db-section-title">About</div>
      <div id="dialog-desc">${d.desc}</div>
    </div>` : ""}

    <div>
      <div class="db-section-title">Stats</div>
      <div class="db-stats">
        <div class="db-stat">
          <div class="st-val" style="color:${color}">${d.rows}</div>
          <div class="st-lbl">rows</div>
        </div>
        <div class="db-stat">
          <div class="st-val">${d.schema ? d.schema.length : d.cols.length}</div>
          <div class="st-lbl">columns</div>
        </div>
        <div class="db-stat">
          <div class="st-val">${inRels.length + outRels.length}</div>
          <div class="st-lbl">relations</div>
        </div>
      </div>
    </div>

    ${d.schema ? `<div>
      <div class="db-section-title">Columns</div>
      <table class="col-table">
        <thead><tr><th>Name</th><th>Type</th><th>Notes</th></tr></thead>
        <tbody>
          ${d.schema.map(([name, type, flag, note]) => `
            <tr>
              <td class="col-name">${flagBadge(flag)}${name}</td>
              <td class="col-type" style="color:${typeColor(type)}">${type}</td>
              <td class="col-note">${note}</td>
            </tr>`).join("")}
        </tbody>
      </table>
    </div>` : ""}

    <div>
      <div class="db-section-title">References (this → other)</div>
      <div class="rel-list">
        ${outRels.length ? outRels.map(r => {
          const rg = nodes.find(n => n.id === r.table)?.group;
          const rc = GROUPS[rg]?.color || "#64748b";
          return `<div class="rel-item" onclick="jumpTo('${r.table}')">
            <span class="rel-arrow">→</span>
            <span class="rel-table" style="color:${rc}">${r.table}</span>
            <span class="rel-key">${r.key}</span>
          </div>`;
        }).join("") : `<div class="rel-empty">none</div>`}
      </div>
    </div>

    <div>
      <div class="db-section-title">Referenced by (other → this)</div>
      <div class="rel-list">
        ${inRels.length ? inRels.map(r => {
          const rg = nodes.find(n => n.id === r.table)?.group;
          const rc = GROUPS[rg]?.color || "#64748b";
          return `<div class="rel-item" onclick="jumpTo('${r.table}')">
            <span class="rel-arrow">←</span>
            <span class="rel-table" style="color:${rc}">${r.table}</span>
            <span class="rel-key">${r.key}</span>
          </div>`;
        }).join("") : `<div class="rel-empty">none</div>`}
      </div>
    </div>
  `;

  overlay.classList.add("open");
  hideTooltip();
}

function closeDialog() { overlay.classList.remove("open"); }

function jumpTo(tableId) {
  closeDialog();
  const node = nodes.find(n => n.id === tableId);
  if (!node) return;
  const t = d3.zoomTransform(svg.node());
  const tx = W / 2 - t.k * node.x;
  const ty = H / 2 - t.k * node.y;
  svg.transition().duration(500).call(zoom.transform, d3.zoomIdentity.translate(tx, ty).scale(t.k));
  setTimeout(() => openDialog(node), 520);
}

document.getElementById("dialog-close").addEventListener("click", closeDialog);
overlay.addEventListener("click", e => { if (e.target === overlay) closeDialog(); });
document.addEventListener("keydown", e => { if (e.key === "Escape") closeDialog(); });
svg.on("click", closeDialog);

// legend
const legendEl = document.getElementById("legend");
Object.entries(GROUPS).forEach(([, {label, color}]) => {
  legendEl.innerHTML += `<div class="leg-item"><div class="leg-dot" style="background:${color}"></div>${label}</div>`;
});

// controls
let frozen = false;
document.getElementById("btn-reset").addEventListener("click", () => {
  svg.transition().duration(600).call(
    zoom.transform,
    d3.zoomIdentity.translate(W * 0.5, H * 0.5).scale(0.55).translate(-W * 0.5, -H * 0.5)
  );
});
document.getElementById("btn-freeze").addEventListener("click", function() {
  frozen = !frozen;
  this.textContent = frozen ? "Unfreeze" : "Freeze";
  this.style.color = frozen ? "#7dd3fc" : "";
  if (frozen) {
    nodes.forEach(d => { d.fx = d.x; d.fy = d.y; });
    sim.stop();
  } else {
    nodes.forEach(d => { d.fx = null; d.fy = null; });
    sim.alphaTarget(0.3).restart();
    setTimeout(() => sim.alphaTarget(0), 1500);
  }
});

window.addEventListener("resize", () => {
  const w = window.innerWidth, h = window.innerHeight;
  svg.attr("width", w).attr("height", h);
});
</script>
</body>
</html>
