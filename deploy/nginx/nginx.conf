# Zero-downtime backend: active-slot controls which blue/green container is live.
# Zero-downtime frontend: atomic symlink swap on /var/www/app, no reload needed.

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $request_time '
                    '"$request" $status $body_bytes_sent "$upstream_addr"';

    access_log /var/log/nginx/access.log main;

    sendfile          on;
    keepalive_timeout 65;

    # Disable file descriptor cache so symlink swaps are picked up immediately.
    open_file_cache   off;

    # active-slot defines the `scoring_active` upstream (blue or green).
    # deploy.sh rewrites this file and sends SIGHUP — no downtime.
    include /etc/nginx/active-slot;

    server {
        listen 80;
        server_name _;

        # ── Backend API ───────────────────────────────────────────────────────
        location /health {
            proxy_pass http://scoring_active/health;
            access_log off;
        }

        location /api/ {
            proxy_pass         http://scoring_active;
            proxy_http_version 1.1;
            proxy_set_header   Connection      "";
            proxy_set_header   Host            $host;
            proxy_set_header   X-Real-IP       $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_connect_timeout 5s;
            proxy_read_timeout    60s;
        }

        # ── Frontend (Vue 3 SPA) ──────────────────────────────────────────────
        # /var/www/app is a symlink managed by deploy-frontend.sh.
        # open_file_cache off ensures nginx follows the updated symlink on the
        # next request — no reload required after a symlink swap.
        root /var/www/app;

        location / {
            try_files $uri $uri/ /index.html;

            location ~* \.(js|css|woff2?|ttf|eot|svg|png|jpg|ico|webp)$ {
                expires 1y;
                add_header Cache-Control "public, immutable";
            }
        }
    }
}
