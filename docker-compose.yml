name: scoring

# Production stack for the scoring turborepo.
#
#   postgres        PostgreSQL 16 (Drizzle target)
#   redis           Redis 7 (ioredis client in the API)
#   api             Fastify + Drizzle backend (apps/api), listens on :4000
#   platform-admin  Vue + Vite SPA (apps/platform-admin)  -> nginx
#   merchant-app    Vue + Vite SPA (apps/merchant-app)    -> nginx
#   client-portal   Vue + Vite SPA (apps/client-portal)   -> nginx
#
# Each SPA's nginx serves the static build AND reverse-proxies /api/v1 to the
# api service, matching the apps' VITE_API_URL=/api/v1 convention.
#
# Quick start:
#   cp .env.docker.example .env   # then fill in JWT_SECRET, integration creds
#   docker compose up -d --build
#
# Every value has a local default, so it also boots with no .env file.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-scoring}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-scoring}
      POSTGRES_DB: ${POSTGRES_DB:-scoring}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-scoring} -d ${POSTGRES_DB:-scoring}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    # Loads MyID / PlumGate / KATM / MinIO / OTEL settings if the file exists.
    # Infra values below override anything in it so they point at the compose network.
    env_file:
      - path: ./apps/api/.env
        required: false
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-scoring}:${POSTGRES_PASSWORD:-scoring}@postgres:5432/${POSTGRES_DB:-scoring}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-change-me-please-at-least-32-characters}
      # Keep external integrations mocked unless real creds are provided.
      PLUM_MOCK: ${PLUM_MOCK:-true}
      KATM_MOCK: ${KATM_MOCK:-true}
    ports:
      - "${API_PORT:-4000}:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('net').connect(4000,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  platform-admin:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        APP_DIR: apps/platform-admin
        VITE_API_URL: /api/v1
    restart: unless-stopped
    ports:
      - "${PLATFORM_ADMIN_PORT:-4001}:80"
    depends_on:
      api:
        condition: service_healthy

  merchant-app:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        APP_DIR: apps/merchant-app
        VITE_API_URL: /api/v1
    restart: unless-stopped
    ports:
      - "${MERCHANT_APP_PORT:-4002}:80"
    depends_on:
      api:
        condition: service_healthy

  client-portal:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        APP_DIR: apps/client-portal
        VITE_API_URL: /api/v1
    restart: unless-stopped
    ports:
      - "${CLIENT_PORTAL_PORT:-4003}:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
