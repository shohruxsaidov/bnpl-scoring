name: scoring
services:
  api:
    build:
      context: ./apps/api
      dockerfile: ./Dockerfile
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    restart: unless-stopped
    env_file:
      - path: ./.env
        required: false
    environment:
      HOST: 0.0.0.0
      PORT: 4000
      JWT_SECRET: ${JWT_SECRET:-change-me-please-at-least-32-characters}
    ports:
      - '${API_PORT:-4000}:4000'
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('net').connect(4000,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  admin-portal:
    build:
      context: ./apps/admin-portal
      dockerfile: ./Dockerfile
      target: serve
      args:
        APP_DIR: apps/admin-portal
        VITE_API_URL: /api/v1
        NGINX_CONF: nginx.admin.conf
    restart: unless-stopped
    ports:
      - '${ADMIN_PORT:-4001}:80'
    depends_on:
      api:
        condition: service_healthy

  merchant-portal:
    build:
      context: ./apps/merchant-portal
      dockerfile: ./Dockerfile
      target: serve
      args:
        APP_DIR: apps/merchant-portal
        VITE_API_URL: /api/v1
    restart: unless-stopped
    ports:
      - '${MERCHANT_PORT:-4002}:80'
    depends_on:
      api:
        condition: service_healthy
