name: scoring

# Production stack for the scoring turborepo.
#
#   postgres        PostgreSQL 16 (Drizzle target)
#   redis           Redis 7 (ioredis client in the API)
#   api             Fastify + Drizzle backend (apps/api), listens on :4000
#   admin-portal    Vue + Vite SPA (apps/admin-portal)    -> nginx
#   merchant-portal Vue + Vite SPA (apps/merchant-portal) -> nginx
#   client-portal   Vue + Vite SPA (apps/client-portal)   -> nginx
#
# Each SPA's nginx serves the static build AND reverse-proxies /api/v1 to the
# api service, matching the apps' VITE_API_URL=/api/v1 convention.
#
# Quick start:
#   cp .env.docker.example .env   # then fill in JWT_SECRET, integration creds
#   docker compose up -d --build
#
# Every value has a local default, so it also boots with no .env file.

services:

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    # Loads MyID / PlumGate / KATM / MinIO / OTEL settings if the file exists.
    # Infra values below override anything in it so they point at the compose network.
    env_file:
      - path: ./apps/api/.env
        required: false
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-scoring}:${POSTGRES_PASSWORD:-scoring}@postgres:5432/${POSTGRES_DB:-scoring}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-change-me-please-at-least-32-characters}
    ports:
      - "${API_PORT:-4000}:4000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('net').connect(4000,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  admin-portal:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        APP_DIR: apps/admin-portal
        VITE_API_URL: /api/v1
    restart: "no"
    volumes:
      - ./dist/admin-portal:/dist

  merchant-portal:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        APP_DIR: apps/merchant-portal
        VITE_API_URL: /api/v1
    restart: "no"
    volumes:
      - ./dist/merchant-portal:/dist

  client-portal:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        APP_DIR: apps/client-portal
        VITE_API_URL: /api/v1
    restart: "no"
    volumes:
      - ./dist/client-portal:/dist


