server {
    listen 10.82.21.82;
    server_name new.uzairways.com;
    return 301 https://new.uzairways.com$request_uri;
}

server {
    listen 10.82.21.82:443 ssl;
    server_name new.uzairways.com;
    index index.php;

    include ssl_conf;

    root /home/bookproject/projects/site-api/public;

    access_log /home/bookproject/logs/new.uzairways.com/access_log main;
    access_log /home/uzairweb/logs/nginx/access_log goaccess;
    error_log  /home/bookproject/logs/new.uzairways.com/error_log info;

    location = /favicon.ico { log_not_found off; access_log off; }
    location = /robots.txt  { allow all; log_not_found off; access_log off; }

    # -------------------------------------------------------
    # 1. /api/ -> proxy container -> booking-api
    # -------------------------------------------------------
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:5001;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_http_version 1.1;
    }

    # -------------------------------------------------------
    # 2. Nuxt internal assets
    # -------------------------------------------------------
    location ^~ /_nuxt/ {
        proxy_pass http://127.0.0.1:5002;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
    }

    # -------------------------------------------------------
    # 3. /{lang}/booking/* → Nuxt SSR
    # -------------------------------------------------------
    location ~ "^/([a-z]{2})/booking(/.*)?$" {
		proxy_pass http://127.0.0.1:5002;
		proxy_set_header Host $http_host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header X-Forwarded-Port $server_port;
		proxy_http_version 1.1;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection 'upgrade';
		proxy_cache_bypass $http_upgrade;
	}

    # -------------------------------------------------------
    # 4. /{lang} main page → Nuxt SSR
    # -------------------------------------------------------
    location ~ "^/([a-z]{2})/?$" {
        proxy_pass http://127.0.0.1:5002;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_cache_bypass $http_upgrade;
    }

    # -------------------------------------------------------
    # 5. Laravel public/ static files
    # -------------------------------------------------------
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|eot|svg|ttf|woff|woff2|pdf|webp)$ {
        try_files $uri =404;
        expires max;
        access_log off;
    }

    # -------------------------------------------------------
    # 6. /{lang}/other-page → Laravel
    # -------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # -------------------------------------------------------
    # 7. PHP-FPM
    # -------------------------------------------------------
    location ~ \.php$ {
#        limit_conn site_conn 32;
#        limit_req zone=site_rate burst=32 nodelay;

        try_files $uri =404;
        fastcgi_pass unix:/var/run/php8-site.s;
        fastcgi_index index.php;
        fastcgi_intercept_errors on;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        include /etc/nginx/fastcgi_params;
    }

    # -------------------------------------------------------
    # 8. Security
    # -------------------------------------------------------
    location ~ /\.(ht|svn|git|env) { deny all; }
    location ~* /(storage|bootstrap/cache|\.env|composer\.(json|lock)|artisan)$ { deny all; }
}
