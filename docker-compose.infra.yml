name: scoring-infra

# Local development infrastructure — backing services only.
# Run this instead of the full docker-compose.yml when developing locally:
#
#   cp .env.infra.example .env.infra
#   docker compose -f docker-compose.infra.yml --env-file .env.infra up -d
#   cd apps/api && pnpm dev
#
# Services:
#   postgres     PostgreSQL 17  localhost:5432
#   redis        KeyDB          localhost:6379
#   garaga       Garage S3      localhost:3900 (S3 API) / localhost:3903 (admin)
#   garaga-webui Garage Web UI  localhost:3909

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-scoring}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-scoring}
      POSTGRES_DB: ${POSTGRES_DB:-scoring}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-scoring} -d ${POSTGRES_DB:-scoring}']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: eqalpha/keydb:latest
    restart: unless-stopped
    command: ['keydb-server', '--appendonly', 'yes']
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'keydb-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  garage:
    image: dxflrs/garage:v2.2.0
    restart: unless-stopped
    volumes:
      - ./garage.toml:/etc/garage.toml:ro
      - garaga-meta:/var/lib/garage/meta
      - garaga-data:/var/lib/garage/data
    ports:
      - '${GARAGE_S3_PORT:-3900}:3900'
      - '${GARAGE_ADMIN_PORT:-3903}:3903'
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3903/health']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  garage-webui:
    image: khairul169/garage-webui:latest
    restart: unless-stopped
    depends_on:
      garage:
        condition: service_healthy
    environment:
      GARAGE_ADMIN_ADDR: http://garage:3903
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN:-garage-admin-token}
    ports:
      - '${GARAGE_UI_PORT:-3909}:3909'

volumes:
  postgres-data:
  redis-data:
  garage-meta:
  garage-data:
