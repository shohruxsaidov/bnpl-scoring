name: scoring-infra

# Local development infrastructure — backing services only.
# Run this instead of the full docker-compose.yml when developing locally:
#
#   cp .env.infra.example .env.infra
#   docker compose -f docker-compose.infra.yml --env-file .env.infra up -d
#   cd apps/api && pnpm dev
#
# Services:
#   postgres     PostgreSQL 17  localhost:5432
#   redis        KeyDB          localhost:6379
#   garaga       Garage S3      localhost:3900 (S3 API) / localhost:3903 (admin)
#   garaga-webui Garage Web UI  localhost:3909

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-scoring}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-scoring}
      POSTGRES_DB: ${POSTGRES_DB:-scoring}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-scoring} -d ${POSTGRES_DB:-scoring}']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: eqalpha/keydb:latest
    restart: unless-stopped
    # noeviction is mandatory, not a tuning knob: BullMQ stores job state in
    # plain keys, so any eviction policy silently drops queued jobs. Pinned
    # explicitly rather than relying on the image default.
    command: ['keydb-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'keydb-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: minio
    ports:
      - '9000:9000'
      - '9001:9001'
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 30s
      timeout: 5s
      retries: 5
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  minio_data:
